name: Build and Upload Custom Packages to CodeArtifact

on:
  push:
    branches:
      - master
    paths:
      - lib/**
  workflow_dispatch:

# Prevent concurrent builds from colliding in CodeArtifact
concurrency:
  group: codeartifact-custom
  cancel-in-progress: false

jobs:
  upload-custom-packages:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Detect changed packages
        id: detect
        run: |
          set -e

          # Find lib/ subdirectories that changed in this push
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^lib/' | cut -d'/' -f2 | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "No changes detected under lib/"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed packages:"
          echo "$CHANGED"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "CHANGED_PACKAGES<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and upload changed packages
        if: steps.detect.outputs.has_changes == 'true'
        env:
          DOMAIN: ${{ secrets.DOMAIN_NAME }}
          REPO: ${{ secrets.REPO_NAME }}
          CHANGED_PACKAGES: ${{ env.CHANGED_PACKAGES }}
        run: |
          set -e

          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$DOMAIN" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          export TWINE_USERNAME=aws
          export TWINE_PASSWORD="$TOKEN"
          export TWINE_REPOSITORY_URL=$(aws codeartifact get-repository-endpoint \
            --domain "$DOMAIN" \
            --repository "$REPO" \
            --format pypi \
            --query repositoryEndpoint \
            --output text)

          UPLOAD_FAILED=0
          while IFS= read -r pkg_dir; do
            [[ -z "$pkg_dir" ]] && continue
            pkg_path="lib/$pkg_dir"

            if [ ! -d "$pkg_path" ]; then
              echo "Warning: $pkg_path no longer exists (deleted?), skipping."
              continue
            fi

            echo "=== Processing: $pkg_path ==="

            if [ ! -f "$pkg_path/pyproject.toml" ]; then
              echo "Error: $pkg_path/pyproject.toml not found."
              echo "All packages under lib/ must define metadata in pyproject.toml."
              UPLOAD_FAILED=1
              continue
            fi

            # Read name and version using Python's built-in tomllib (Python 3.11+)
            pkg_name=$(TOML_PATH="$pkg_path/pyproject.toml" python3 -c "import tomllib,os; d=tomllib.load(open(os.environ['TOML_PATH'],'rb')); print(d['project']['name'].lower().replace('_','-'))")
            pkg_ver=$(TOML_PATH="$pkg_path/pyproject.toml" python3 -c "import tomllib,os; d=tomllib.load(open(os.environ['TOML_PATH'],'rb')); print(d['project']['version'])")

            if [ -z "$pkg_name" ] || [ -z "$pkg_ver" ]; then
              echo "Error: Could not read [project] name or version from $pkg_path/pyproject.toml"
              UPLOAD_FAILED=1
              continue
            fi

            echo "Package: $pkg_name==$pkg_ver"

            # Enforce version bump: if this version already exists, the developer
            # changed files without updating the version — block the upload.
            exists=$(aws codeartifact list-package-versions \
              --domain "$DOMAIN" \
              --repository "$REPO" \
              --format pypi \
              --package "$pkg_name" \
              --query "versions[?version=='$pkg_ver'].version" \
              --output text 2>/dev/null || true)

            if [ -n "$exists" ]; then
              echo "Error: $pkg_name==$pkg_ver already exists in CodeArtifact."
              echo "Files in $pkg_path changed but the version was not bumped."
              echo "Please update [project] version in $pkg_path/pyproject.toml and push again."
              UPLOAD_FAILED=1
              continue
            fi

            # Build: produces both sdist (.tar.gz) and wheel (.whl) in one command
            echo "Building $pkg_name==$pkg_ver..."
            rm -rf "$pkg_path/dist"
            if ! python -m build "$pkg_path" --outdir "$pkg_path/dist"; then
              echo "Error: Build failed for $pkg_path"
              UPLOAD_FAILED=1
              continue
            fi

            echo "Built artifacts:"
            ls -lh "$pkg_path/dist/"

            if twine upload "$pkg_path/dist/"*; then
              echo "Successfully uploaded $pkg_name==$pkg_ver"
            else
              echo "Error: Upload failed for $pkg_name==$pkg_ver"
              UPLOAD_FAILED=1
            fi
          done < <(echo "$CHANGED_PACKAGES")

          if [ "$UPLOAD_FAILED" -ne 0 ]; then
            echo "One or more packages failed. Review errors above."
            exit 1
          fi
